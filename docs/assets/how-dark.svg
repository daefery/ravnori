<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="How ravnori works"><defs><marker id="ah-126011623352448" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8FA69C"/></marker></defs><rect width="1280" height="540" rx="20" fill="#102825"/><rect x="0.5" y="0.5" width="1279" height="539" rx="20" fill="none" stroke="#24453F"/><rect x="40" y="70" width="250" height="96" rx="14" fill="#16332F" stroke="#24453F"/><text x="58" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9F2E7">Claude Code</text><text x="58" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">writes ~/.claude/projects</text><rect x="40" y="190" width="250" height="96" rx="14" fill="#16332F" stroke="#24453F"/><text x="58" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9F2E7">Codex</text><text x="58" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">writes ~/.codex/sessions</text><rect x="40" y="310" width="250" height="96" rx="14" fill="#16332F" stroke="#24453F"/><text x="58" y="342" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9F2E7">pi</text><text x="58" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">writes ~/.pi/agent/sessions</text><rect x="380" y="70" width="470" height="336" rx="16" fill="#1D3D38" stroke="#B5E38B" stroke-width="2"/><g transform="translate(398,86) scale(0.24242424242424243)">
  <path d="M30 114 C22 90 22 60 40 44 C54 31 76 28 92 37 C104 44 114 50 126 58 C114 62 102 66 90 70 C88 84 86 100 84 114 Z" fill="#E9F2E7"/>
  <circle cx="68" cy="52" r="7.5" fill="#B5E38B"/>
</g><text x="438" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#E9F2E7">ravnori</text><text x="402" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B5E38B">Capture</text><text x="476" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">reads transcripts as they grow; a crash or</text><text x="476" y="179" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">a missed hook delays it, never loses it</text><text x="402" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B5E38B">Record</text><text x="476" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">one local SQLite: prompts, edits, commands;</text><text x="476" y="243" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">deduplicated, secrets redacted, deletable</text><text x="402" y="286" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B5E38B">Distil</text><text x="476" y="286" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">memories that cite the events they came from,</text><text x="476" y="307" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">with your own Claude Code, Codex or endpoint</text><text x="402" y="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B5E38B">Check</text><text x="476" y="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">whether a memory's own code is still there</text><rect x="940" y="70" width="300" height="96" rx="14" fill="#16332F" stroke="#B5E38B"/><text x="958" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9F2E7">Back to your agents</text><text x="958" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">session start, each prompt, opening a file</text><text x="958" y="153" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">MCP tools: search, get_observations, …</text><rect x="940" y="190" width="300" height="96" rx="14" fill="#16332F" stroke="#24453F"/><text x="958" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9F2E7">To you</text><text x="958" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">the viewer at 127.0.0.1:37777</text><text x="958" y="273" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">rvn ask “why did we …”, with sources</text><rect x="940" y="310" width="300" height="96" rx="14" fill="#16332F" stroke="#24453F"/><text x="958" y="342" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9F2E7">To your tools</text><text x="958" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">record API: read-only, local, token</text><text x="958" y="393" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#BCCDC2">rvn trace: Agent Trace for commits</text><line x1="296" y1="118" x2="372" y2="118" stroke="#8FA69C" stroke-width="2" marker-end="url(#ah-126011623352448)"/><line x1="856" y1="118" x2="932" y2="118" stroke="#8FA69C" stroke-width="2" marker-end="url(#ah-126011623352448)"/><line x1="296" y1="238" x2="372" y2="238" stroke="#8FA69C" stroke-width="2" marker-end="url(#ah-126011623352448)"/><line x1="856" y1="238" x2="932" y2="238" stroke="#8FA69C" stroke-width="2" marker-end="url(#ah-126011623352448)"/><line x1="296" y1="358" x2="372" y2="358" stroke="#8FA69C" stroke-width="2" marker-end="url(#ah-126011623352448)"/><line x1="856" y1="358" x2="932" y2="358" stroke="#8FA69C" stroke-width="2" marker-end="url(#ah-126011623352448)"/><text x="640" y="458" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#BCCDC2">Everything stays on your machine. The only thing that leaves it: redacted excerpts sent to the model <tspan font-weight="700">you</tspan> choose, to write memories.</text><text x="640" y="488" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#BCCDC2">One binary · no Node, Python, Docker or vector database · Linux, WSL and macOS</text></svg>
