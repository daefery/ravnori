# Prebuilt binaries, so nobody needs Rust to use ravnori. A tag like v0.2.0 builds every
# target, tests it on the machine it runs on, and attaches the archives and their
# checksums to a GitHub release. `workflow_dispatch` builds and tests without
# releasing (the artifacts stay on the run), for checking a change first.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The prebuilt ONNX Runtime needs glibc 2.38+ (it uses __isoc23_strtol and
          # GCC 13's libstdc++), so the full Linux build is made on Ubuntu 24.04 and runs
          # on glibc 2.39+ (Ubuntu 24.04, Debian 13, Fedora 40 and newer).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, features: fastembed, suffix: "" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, features: fastembed, suffix: "" }
          # For older Linux (glibc 2.35+: Ubuntu 22.04, Debian 12): the same ravnori without
          # ONNX Runtime, so meaning search uses the small potion model.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, features: "", suffix: "-lite" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, features: "", suffix: "-lite" }
          - { target: aarch64-apple-darwin, os: macos-15, features: fastembed, suffix: "" }
          # ONNX Runtime ships no prebuilt library for Intel Macs: the lite build.
          - { target: x86_64-apple-darwin, os: macos-15, features: "", suffix: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}${{ matrix.suffix }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"
      # Tests run where the binary can run: every target but the Intel one, which the
      # Apple Silicon runner builds without running.
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"
      - name: Smoke test the binary
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/rvn
          "$bin" --version
          export HOME="$RUNNER_TEMP/home" RAVNORI_HOME="$RUNNER_TEMP/home/.ravnori"
          mkdir -p "$HOME"
          "$bin" install --dry-run --watch
          "$bin" doctor
      - name: Package
        shell: bash
        run: |
          name=ravnori-${{ matrix.target }}${{ matrix.suffix }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/rvn README.md NOTICE LICENSE "dist/$name/"
          features=""
          [ -n "${{ matrix.features }}" ] && features="--features ${{ matrix.features }}"
          python3 scripts/third-party-licenses.py $features --target ${{ matrix.target }} > "dist/$name/THIRD-PARTY-LICENSES.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ravnori-${{ matrix.target }}${{ matrix.suffix }}
          path: dist/ravnori-${{ matrix.target }}${{ matrix.suffix }}.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/checksums.txt
          # Only the highest version is "latest" (what install.sh fetches by default):
          # rebuilding an older tag must not take that over.
          # Read the tags from GitHub: fetching them would clash with the checked-out tag.
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "this: $GITHUB_REF_NAME, highest: $highest"
          latest=false
          [ "$GITHUB_REF_NAME" = "$highest" ] && latest=true
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt install.sh \
            --title "ravnori $GITHUB_REF_NAME" --generate-notes --latest=$latest
