[package]
name = "ravnori"
version = "0.6.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/daefery/ravnori"
description = "Local-first memory and activity record for coding agents, read from the transcripts they already write"

[[bin]]
name = "rvn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
fastembed = { version = "7.1.0", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
model2vec-rs = "0.3.0"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml_edit = "0.25.15"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[features]
fastembed = ["dep:fastembed"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
